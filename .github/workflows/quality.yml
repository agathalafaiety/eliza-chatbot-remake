name: Qualidade e testes

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  environment:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Instalar dependências de desenvolvimento
        run: python -m pip install -r requirements-dev.txt
      - name: Verificar dependências
        run: python -m pip check
      - name: Verificar estilo
        run: python -m ruff check .
      - name: Verificar formatação
        run: python -m ruff format --check .
      - name: Testar Classic, persistência e interface
        run: python -m pytest -q
      - name: Verificar SQLite e imports
        run: python tools/check_environment.py --notebooks
      - name: Validar e executar notebook
        run: python tools/validate_notebook.py --execute
